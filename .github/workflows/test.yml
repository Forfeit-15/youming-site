name: Functional tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  functional-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Check out the checker's tests
        uses: actions/checkout@v4
        with:
          repository: Forfeit-15/youming-site-tests
          path: tests

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies and Chromium
        working-directory: tests
        run: npm ci && npx playwright install --with-deps chromium

      - name: Serve public/ on port 8000
        run: |
          python3 -m http.server 8000 --directory public > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000 > /dev/null && exit 0
            sleep 1
          done
          echo "Site did not start"; cat server.log; exit 1

      - name: Run functional tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:8000
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
